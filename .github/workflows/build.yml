name: Build and Sign iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Inject TV certificate
        run: |
          echo "${{ secrets.TV_P12_BASE64 }}" | base64 --decode > XiaomiRemote/tv_identity.p12

      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -scheme XiaomiRemote \
            -archivePath ${{ github.workspace }}/build/XiaomiRemote.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Debug archive structure
        run: find ${{ github.workspace }}/build/XiaomiRemote.xcarchive -type f 2>/dev/null | head -30 || echo "Archive not found"

      - name: Package unsigned IPA
        run: |
          mkdir -p ${{ github.workspace }}/build/Payload
          cp -r ${{ github.workspace }}/build/XiaomiRemote.xcarchive/Products/Applications/XiaomiRemote.app \
                ${{ github.workspace }}/build/Payload/XiaomiRemote.app
          cd ${{ github.workspace }}/build
          zip -r XiaomiRemote-unsigned.ipa Payload/

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Sign IPA
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DONT_STORE_PASSWORD: "1"
        run: fastlane sign

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiRemote-signed
          path: build/XiaomiRemote-signed.ipa
          retention-days: 7
