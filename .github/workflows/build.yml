name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -scheme XiaomiRemote \
            -archivePath ${{ github.workspace }}/build/XiaomiRemote.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || true

      - name: Package IPA
        run: |
          mkdir -p ${{ github.workspace }}/build/Payload
          cp -r ${{ github.workspace }}/build/XiaomiRemote.xcarchive/Products/Applications/XiaomiRemote.app \
                ${{ github.workspace }}/build/Payload/XiaomiRemote.app
          cd ${{ github.workspace }}/build
          zip -r XiaomiRemote-unsigned.ipa Payload/
          echo "IPA size: $(du -sh XiaomiRemote-unsigned.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiRemote-unsigned
          path: build/XiaomiRemote-unsigned.ipa
          retention-days: 7
