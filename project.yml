name: XiaomiRemote
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: 16.0
  xcodeVersion: "15.0"

targets:
  XiaomiRemote:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: XiaomiRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.xiaomiremote
        PRODUCT_NAME: XiaomiRemote
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: 1
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: XiaomiRemote/App/Info.plist
      properties:
        CFBundleDisplayName: Mando Universal
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Necesario para conectar con tu Smart TV en la red local."
        NSBonjourServices:
          - "_androidtvremote2._tcp"
