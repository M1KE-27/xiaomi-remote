<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XiaomiRemote · Preview</title>
<style>
  :root{ --bg:#000; --accent:#ff7a00; --accent2:#ff2d00; --soft:rgba(255,255,255,.10); --soft2:rgba(255,255,255,.05); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:-apple-system,"Segoe UI",Roboto,sans-serif;}
  body{margin:0;background:#111;display:flex;gap:30px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:30px;color:#fff;}
  .phone{width:340px;height:720px;background:var(--bg);border-radius:46px;border:10px solid #1c1c1e;
         box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .screen{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .view{flex:1;display:none;flex-direction:column;padding:18px 22px;overflow:auto;}
  .view.active{display:flex;}
  /* Tab bar */
  .tabbar{height:64px;background:#0c0c0c;border-top:1px solid #222;display:flex;}
  .tabbar button{flex:1;background:none;border:none;color:#666;font-size:11px;display:flex;flex-direction:column;
                 align-items:center;justify-content:center;gap:3px;cursor:pointer;}
  .tabbar button.sel{color:var(--accent);}
  .tabbar .ico{font-size:20px;}
  /* Remote */
  .topbar{display:flex;align-items:center;margin-top:6px;}
  .topbar .spacer{flex:1;}
  .btn{width:44px;height:44px;border-radius:50%;background:var(--soft);color:#fff;border:none;display:inline-flex;
       align-items:center;justify-content:center;font-size:17px;cursor:pointer;transition:transform .1s,background .1s,color .1s;margin:4px;}
  .btn:active{transform:scale(.9);background:#fff;color:#000;}
  .btn.big{width:64px;height:64px;font-size:20px;}
  .btn.small{width:40px;height:40px;font-size:15px;}
  .pad{align-self:center;margin:auto 0;width:220px;height:220px;border-radius:50%;background:var(--soft2);
       display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .pad .row{display:flex;align-items:center;}
  .media,.volume{display:flex;justify-content:center;align-items:center;gap:14px;margin:10px 0;}
  .volume{gap:22px;}
  /* Settings */
  h2{font-size:15px;color:#8e8e93;text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px;font-weight:600;}
  .card{background:#1c1c1e;border-radius:12px;overflow:hidden;}
  .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #2a2a2c;cursor:pointer;}
  .item:last-child{border-bottom:none;}
  .item .sub{font-size:12px;color:#8e8e93;}
  .item .chev{margin-left:auto;color:#555;}
  .accent{color:var(--accent);}
  input.ip{flex:1;background:none;border:none;color:#fff;font-size:15px;outline:none;}
  /* Radar */
  .radar{position:relative;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;}
  .radar .dot{font-size:18px;}
  .radar.on .ring{position:absolute;inset:0;border:2px solid var(--accent);border-radius:50%;animation:pulse 1.1s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
  /* Pairing overlay */
  .overlay{position:absolute;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:5;}
  .overlay.show{display:flex;}
  .pulse{position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center;}
  .pulse .ring{position:absolute;inset:0;border:2px solid var(--accent);border-radius:50%;opacity:.7;animation:expand 1.6s ease-out infinite;}
  .pulse .ring:nth-child(2){animation-delay:.5s}.pulse .ring:nth-child(3){animation-delay:1s}
  @keyframes expand{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.4);opacity:0}}
  .pulse .tv{font-size:46px;color:var(--accent);}
  .code{font:700 34px/1 ui-monospace,monospace;color:var(--accent);background:rgba(255,255,255,.08);
        border-radius:14px;padding:14px 22px;letter-spacing:6px;}
  .cta{background:var(--accent);color:#000;border:none;border-radius:14px;padding:14px 30px;font-weight:700;font-size:16px;cursor:pointer;}
  .ghost{background:none;border:none;color:#8e8e93;cursor:pointer;font-size:15px;}
  .title{font-size:20px;font-weight:700;}
  .hint{font-size:13px;color:#8e8e93;text-align:center;max-width:240px;}
  .label{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:12px;color:#555;}
</style>
</head>
<body>

<div class="phone">
  <div class="label">REMOTE</div>
  <div class="screen">
    <!-- Remote tab -->
    <div class="view active" id="remote">
      <div class="topbar">
        <button class="btn" title="Power">⏻</button>
        <span class="spacer"></span>
        <button class="btn" title="Home">⌂</button>
        <button class="btn" title="Back">‹</button>
        <button class="btn" title="Menu">≡</button>
      </div>
      <div class="pad">
        <button class="btn" title="Up">▲</button>
        <div class="row">
          <button class="btn" title="Left">◀</button>
          <button class="btn big" title="OK">OK</button>
          <button class="btn" title="Right">▶</button>
        </div>
        <button class="btn" title="Down">▼</button>
      </div>
      <div class="media">
        <button class="btn small">⏮</button>
        <button class="btn small">⏪</button>
        <button class="btn big">⏯</button>
        <button class="btn small">⏩</button>
        <button class="btn small">⏭</button>
      </div>
      <div class="volume">
        <button class="btn">🔉</button>
        <button class="btn small">🔇</button>
        <button class="btn">🔊</button>
      </div>
    </div>

    <!-- Settings tab -->
    <div class="view" id="settings">
      <h2>Dispositivos</h2>
      <div class="card">
        <div class="item" onclick="toggleScan(this)">
          <span class="radar" id="radar"><span class="ring"></span><span class="dot accent">📡</span></span>
          <span id="scanlabel">Buscar dispositivos</span>
        </div>
        <div class="item" onclick="openPairing()">
          <span class="accent">📺</span>
          <div><div>MiTV-MSSP2</div><div class="sub">192.168.3.17</div></div>
          <span class="chev">›</span>
        </div>
      </div>

      <h2>IP manual</h2>
      <div class="card"><div class="item">🌐<input class="ip" value="192.168.3.17"></div></div>

      <h2>Conexión</h2>
      <div class="card">
        <div class="item"><span style="width:10px;height:10px;border-radius:50%;background:#34c759;display:inline-block"></span> Conectado</div>
        <div class="item accent" onclick="openPairing()">Conectar / Emparejar</div>
        <div class="item" style="color:#8e8e93">Olvidar emparejamiento</div>
      </div>
    </div>
  </div>

  <!-- Pairing overlay -->
  <div class="overlay" id="pairing">
    <div class="pulse"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="tv">📺</span></div>
    <div class="title">Introduce el código</div>
    <div class="hint">Mira el código que aparece en la pantalla del TV y escríbelo aquí.</div>
    <div class="code">A1B2C3</div>
    <button class="cta" onclick="closePairing()">Emparejar</button>
    <button class="ghost" onclick="closePairing()">Cancelar</button>
  </div>

  <div class="tabbar">
    <button class="sel" id="t0" onclick="tab(0)"><span class="ico">📱</span>Remote</button>
    <button id="t1" onclick="tab(1)"><span class="ico">⚙️</span>Ajustes</button>
  </div>
</div>

<script>
  function tab(i){
    document.getElementById('remote').classList.toggle('active', i===0);
    document.getElementById('settings').classList.toggle('active', i===1);
    document.getElementById('t0').classList.toggle('sel', i===0);
    document.getElementById('t1').classList.toggle('sel', i===1);
    document.querySelector('.label').textContent = i===0?'REMOTE':'AJUSTES';
  }
  function toggleScan(el){
    const r=document.getElementById('radar'), l=document.getElementById('scanlabel');
    const on=r.classList.toggle('on'); l.textContent = on?'Buscando...':'Buscar dispositivos';
  }
  function openPairing(){ document.getElementById('pairing').classList.add('show'); }
  function closePairing(){ document.getElementById('pairing').classList.remove('show'); }
</script>
</body>
</html>
